name: Deployment smoke
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      app:
        type: choice
        options: [main, graph, ai, lab, studio, study, club]
        required: true
      url:
        type: string
        required: true
permissions:
  contents: read
jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check deployment
        env:
          DEPLOY_APP: ${{ inputs.app || github.event.deployment.environment }}
          DEPLOY_URL: ${{ inputs.url || github.event.deployment_status.environment_url }}
        run: npm run smoke -- "$DEPLOY_APP" "$DEPLOY_URL"
