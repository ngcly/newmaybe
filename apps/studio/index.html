      rel="stylesheet"
    />

    <script>
      (function () {
        const cookieTheme = document.cookie.match(/(?:^|;\s*)theme=(dark|light)(?:;|$)/)?.[1];
        let savedTheme;
        try {
          savedTheme = localStorage.getItem('theme');
        } catch {
          // Continue with the cookie or system preference when storage is blocked.
        }
        const theme =
          cookieTheme ||
          (savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : null) ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.classList.toggle('light', theme === 'light');
        const metas = document.querySelectorAll('meta[name="theme-color"]');
        const color = metas[theme === 'dark' ? 1 : 0]?.content;
        if (color && metas[0]) {
          metas[0].content = color;
          metas[0].removeAttribute('media');
          metas.forEach((meta, index) => {
            if (index > 0) meta.remove();
          });
          document.documentElement.style.backgroundColor = color;
        }
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
