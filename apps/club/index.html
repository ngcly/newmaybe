    <script>
      (function () {
        const match = document.cookie.match(/theme=(dark|light)/);
        const theme =
          (match && match[1]) ||
          localStorage.getItem('theme') ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.classList.add(theme);
      })();
